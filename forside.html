  <!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fuld HF – oversigt over fag og niveauer</title>
  <style>
    :root{
      --ink:#1f1f1f;
      --muted:#5f5f5f;
      --line:#7b7b7b;
      --panel:#e9e9e9;
      --panel2:#f4f4f4;
      --white:#fff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:#efefef;
      color:var(--ink);
      line-height:1.25;
    }
    .page{
      width:min(920px, calc(100% - 24px));
      margin:24px auto;
      background:var(--white);
      padding:34px 38px 40px;
      box-shadow:0 2px 14px rgba(0,0,0,.12);
    }
    h1{
      margin:0 0 22px;
      padding:10px 14px;
    
      background:#4a4a4a;
      color:#fff;
      font-size:28px;
      letter-spacing:.4px;
      text-transform:uppercase;
    }
    h2{
        text-align: center;
    }
    .intro, .section-title{
      font-size:13px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.15px;
    }
    .intro{margin:0 0 10px}
    .top-grid{
      display:grid;
      grid-template-columns:1fr 1.05fr;
      gap:34px;
      align-items:start;
    }
    .subjects{
      display:grid;
      grid-template-columns:26px 1fr 24px;
      gap:8px 10px;
      align-items:center;
      font-size:16px;
    }
    .subjects .num{
      font-weight:700;
      text-align:right;
    }
    input[type="submit"]{
         border: 2px solid rgba(0, 0, 0, 0.767);
         background-color: transparent;
     border-radius: 5px;
     display: block;
     width: 300px;
     font-size: 20px;
     padding: 0.5rem;
     margin: 0 auto;
     margin-top: 1rem;
     font-weight: bold;
     transition: 0.4s;
     letter-spacing: 2px;
     
    }
    input[type="submit"]:hover{
        background-color: rgba(0, 0, 0, 0.767);
        border: 2px solid transparent;
        color: white;
    }
    input[type="text"]{
     border: 1px solid black;
     border-radius: 5px;
     display: block;
     width: 300px;
     font-size: 20px;
     padding: 0.5rem;
     margin: 0 auto;
     letter-spacing: 2px;
     font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif
    }
    .in
    .creative{
      border:2px solid #777;
      padding:12px 16px 10px;
      margin-top:33px;
      font-size:15px;
    }
    .creative strong{font-size:16px}
    .creative ul{
      margin:6px 0 5px;
      padding-left:24px;
      list-style:"–  ";
    }
    .note{font-size:13px}
    .chooser-note{
      margin:22px 0 12px;
      font-size:13px;
      font-weight:700;
      text-transform:uppercase;
    }
    .combo{
      display:grid;
      grid-template-columns:1fr 310px;
      gap:18px;
      background:var(--panel);
      padding:10px 12px;
      margin:0 0 5px;
    }
    .combo:nth-of-type(even){background:#dedede}
    .combo h2{
      font-size:16px;
      margin:0 0 5px;
      text-transform:uppercase;
    }
    .combo p{
      margin:3px 0;
      font-size:14px;
    }
    .choices{
      display:grid;
      gap:7px;
      align-content:start;
    }
    .choice-row{
      display:grid;
      grid-template-columns:1fr auto 20px;
      gap:8px;
      align-items:center;
    }
    .choice-row input[type="text"]{
      border:0;
      border-bottom:1px solid #777;
      background:transparent;
      min-width:0;
      height:22px;
      padding:0 4px;
      font:inherit;
    }
    .level{
      min-width:38px;
      text-align:right;
      font-size:14px;
    }
    .small-check{
      width:16px !important;
      height:16px !important;
      border-width:1.7px !important;
    }
    .section-title{
      margin:18px 0 7px;
    }
    .boxed{
      border:2px solid #555;
      padding:8px 10px;
    }
    .exam-row, .uni-row{
      display:grid;
      grid-template-columns:1fr 22px;
      gap:10px;
      align-items:center;
      margin:4px 0;
      font-size:15px;
    }
    .uni-row{
      grid-template-columns:1fr 180px 42px 22px;
    }
    .dots{
      border-bottom:2px dotted #777;
      height:12px;
    }
    footer{
      margin-top:14px;
      font-size:11px;
      color:var(--muted);
      text-align:right;
    }
    @media (max-width:720px){
      .page{padding:24px 18px}
      h1{font-size:22px}
      .top-grid{grid-template-columns:1fr}
      .creative{margin-top:0}
      .combo{grid-template-columns:1fr}
      .uni-row{grid-template-columns:1fr 90px 42px 22px}
    }
    @media print{
      @page{size:A4; margin:11mm}
      body{background:#fff}
      .page{
        width:auto;
        margin:0;
        padding:0;
        box-shadow:none;
      }
      h1{font-size:21px}
      .combo{break-inside:avoid}
      footer{display:none}
    }
  </style>
</head>
<body>
  <main class="page">
<h1>Fuld HF – oversigt over fag og niveauer</h1>
<h2>Indatst venligst dit cpr nummer</h2>

<form action="./fuld-hf-oversigt.html">
        <input name="cpr" id="cpr" type="text" placeholder="123456-0909">
        <input type="submit" value="Få din oversigt" placeholder="" >
    </form>
      </main>
</body>
</html>

<script>

    const input = document.querySelector("input#cpr")
    input.addEventListener("input", (ev)=>{
       
        if (input.value.length == 6 && ev.inputType != "deleteContentBackward"){
            input.value = input.value + "-"
        }else if(input.value.length == 12){
          input.value = input.value.slice(0,11)

        }
       
    })
</script>
